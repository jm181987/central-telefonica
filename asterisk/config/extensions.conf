; Central Telefonica dialplan
[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
OUTBOUND_TRUNK=PJSIP/vono

[from-internal]
exten => _1XXX,1,NoOp(Internal call ${CALLERID(num)} -> ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30,tT)
 same => n,VoiceMail(${EXTEN}@default,u)
 same => n,Hangup()

exten => _[2-9]XXX,1,Goto(${EXTEN},1)

; Prefix 9 for PSTN; strip it before sending to provider.
exten => _9X.,1,NoOp(Outbound via VONO: ${EXTEN:1})
 same => n,Set(CALLERID(num)=${VONO_FROM_USER})
 same => n,Gosub(recording,s,1(outbound,${EXTEN:1}))
 same => n,Dial(PJSIP/${EXTEN:1}@vono,60,b(to-vono^setheaders^1))
 same => n,Hangup()

exten => 6000,1,Goto(main-ivr,s,1)
exten => 6100,1,Queue(sales,tT,,,60)
exten => 6200,1,VoiceMailMain(@default)
exten => 6300,1,ConfBridge(6300,default_bridge,default_user)

[to-vono]
exten => setheaders,1,NoOp(Set provider headers)
 same => n,Set(PJSIP_HEADER(add,X-PBX-Source)=central-telefonica)
 same => n,Return()

[from-vono]
exten => _X.,1,NoOp(Inbound VONO DID ${EXTEN} from ${CALLERID(all)})
 same => n,Gosub(recording,s,1(inbound,${EXTEN}))
 ; Route examples. Replace/add mappings to match assigned DIDs.
 same => n,GotoIf($["${EXTEN}"="${VONO_USERNAME}"]?main-ivr,s,1)
 same => n,Goto(main-ivr,s,1)

exten => s,1,Goto(main-ivr,s,1)

[main-ivr]
exten => s,1,Answer()
 same => n,Set(TIMEOUT(digit)=5)
 same => n,Set(TIMEOUT(response)=10)
 same => n,Background(vm-enter-num-to-call)
 same => n,WaitExten(10)
exten => 1,1,Goto(from-internal,1000,1)
exten => 2,1,Queue(sales,tT,,,60)
exten => 3,1,ConfBridge(6300,default_bridge,default_user)
exten => i,1,Goto(s,1)
exten => t,1,Hangup()

[recording]
exten => s,1,NoOp(Recording policy)
 same => n,GotoIf($["${RECORD_CALLS}"!="true"]?done)
 same => n,Set(RECORDING_FILE=${STRFTIME(${EPOCH},,%Y/%m/%d)}/${UNIQUEID}-${ARG1}-${ARG2})
 same => n,MixMonitor(${RECORDING_FILE}.wav,b)
 same => n(done),Return()

[ari-originate]
; ARI creates a Local channel here to keep dialing policy in dialplan.
exten => _X.,1,Dial(PJSIP/${EXTEN}@vono,60)
 same => n,Hangup()
