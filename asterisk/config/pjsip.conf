; Central Telefonica - PJSIP
[global]
type=global
user_agent=Central-Telefonica
endpoint_identifier_order=ip,username,anonymous

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/tls/fullchain.pem
priv_key_file=/etc/asterisk/tls/privkey.pem
method=tlsv1_2
verify_client=no
verify_server=yes
allow_reload=yes

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0

[vono-auth]
type=auth
auth_type=userpass
username=${VONO_AUTH_USERNAME}
password=${VONO_PASSWORD}

[vono-aor]
type=aor
contact=sip:${VONO_HOST}:${VONO_PORT}
qualify_frequency=30

[vono]
type=endpoint
transport=transport-tls
context=from-vono
disallow=all
allow=${VONO_CODECS}
aors=vono-aor
outbound_auth=vono-auth
from_user=${VONO_FROM_USER}
from_domain=${VONO_FROM_DOMAIN}
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
send_pai=yes
trust_id_inbound=yes
trust_id_outbound=yes
media_encryption=sdes

[vono-identify]
type=identify
endpoint=vono
match=${VONO_HOST}

[vono-registration]
type=registration
transport=transport-tls
outbound_auth=vono-auth
server_uri=sip:${VONO_HOST}:${VONO_PORT}
client_uri=sip:${VONO_USERNAME}@${VONO_HOST}
contact_user=${VONO_USERNAME}
retry_interval=30
forbidden_retry_interval=300
expiration=300
line=yes
endpoint=vono

; WebRTC endpoint template. API-generated endpoints inherit these settings.
[webrtc-template](!)
type=endpoint
transport=transport-wss
context=from-internal
disallow=all
allow=opus,ulaw,alaw,g722
webrtc=yes
dtls_auto_generate_cert=no
dtls_cert_file=/etc/asterisk/tls/fullchain.pem
dtls_private_key=/etc/asterisk/tls/privkey.pem
dtls_verify=fingerprint
dtls_setup=actpass
media_encryption=dtls
ice_support=yes
rtcp_mux=yes
use_avpf=yes
direct_media=no
dtmf_mode=rfc4733

[webrtc-aor-template](!)
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=30
